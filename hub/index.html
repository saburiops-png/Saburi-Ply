<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>Resource Hub · Saburi Ply</title>
  <style>html,body{height:100%;margin:0;background:#0d0f15;color:#fff;font:600 15px Inter,Roboto,Arial,sans-serif;display:grid;place-items:center}a{color:#fff}</style>
</head>
<body>
  <a href="../#hub">Open Resource Hub</a>
  <script>
    // This page now opens Resource Hub inside the main Saburi Ply app.
    (function () {
      var go = function () { location.replace('../#hub'); };
      var timer = setTimeout(go, 500);
      if (!('serviceWorker' in navigator)) { clearTimeout(timer); go(); return; }
      // remove the old helper file that earlier versions installed for this page
      navigator.serviceWorker.getRegistrations().then(function (list) {
        return Promise.all(list.filter(function (r) { return /\/(hub|dsr)\/$/.test(new URL(r.scope).pathname); }).map(function (r) { return r.unregister(); }));
      }).catch(function () {}).then(function () { clearTimeout(timer); go(); });
    })();
  </script>
</body>
</html>
