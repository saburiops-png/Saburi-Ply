<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Resource Hub</title>
  <meta name="theme-color" content="#14171f">
  <link rel="manifest" href="manifest.json">
  <link rel="icon" type="image/png" sizes="32x32" href="../icons/favicon-32.png">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <link rel="preconnect" href="https://script.google.com">
  <link rel="preconnect" href="https://script.googleusercontent.com">
  <style>
    html, body { margin: 0; height: 100%; background: #14171f; overflow: hidden; }
    iframe { border: 0; width: 100%; height: 100%; display: block; background: #fff; }
    .loader {
      position: fixed; inset: 0; z-index: 2;
      display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 18px;
      background: #14171f; color: #c4c9d4; font: 600 14px Inter, Roboto, Arial, sans-serif;
      transition: opacity .35s cubic-bezier(.2,.8,.2,1), visibility 0s linear .35s;
    }
    .loader.done { opacity: 0; visibility: hidden; }
    .loader img { width: 110px; height: auto; }
    @keyframes breathe { 0%,100% { transform: scale(1); } 50% { transform: scale(1.08); } }
    .track { width: 160px; height: 4px; border-radius: 4px; background: rgba(255,255,255,.12); overflow: hidden; }
    .track i { display: block; width: 40%; height: 100%; border-radius: inherit; background: #d32f2f; animation: slide 1.1s cubic-bezier(.2,.8,.2,1) infinite; }
    @keyframes slide { from { transform: translate3d(-110%,0,0); } to { transform: translate3d(260%,0,0); } }
    .loader a { color: #fff; font-size: 13px; opacity: 0; transition: opacity .4s; }
    .loader a.show { opacity: 1; }
    @media (prefers-reduced-motion: reduce) { .loader img, .track i { animation: none; } }
  </style>
</head>
<body>
  <iframe id="app" title="Resource Hub" allow="camera; microphone; geolocation; clipboard-write"
    src="https://script.google.com/macros/s/AKfycby1QnPsMgcKn8BGaJvxnxBVuzC83ZBsORvrFiS6zKjWDq2CxwRGavhFGfy-VnjVfr0t/exec"></iframe>

  <div class="loader" id="loader">
    <img src="../assets/saburi-logo-anim.webp" alt="" width="300" height="313">
    <div class="track"><i></i></div>
    <span>Opening Resource Hub…</span>
    <a id="direct" href="https://script.google.com/macros/s/AKfycby1QnPsMgcKn8BGaJvxnxBVuzC83ZBsORvrFiS6zKjWDq2CxwRGavhFGfy-VnjVfr0t/exec" target="_blank" rel="noopener">Taking long? Open in Chrome</a>
  </div>

  <script>
    var frame = document.getElementById('app');
    var loader = document.getElementById('loader');
    frame.addEventListener('load', function () { loader.classList.add('done'); });
    setTimeout(function () { document.getElementById('direct').classList.add('show'); }, 8000);
    if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js');
  </script>
</body>
</html>
