<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>DSR Form · Saburi Ply</title>
  <meta name="theme-color" content="#14171f">
  <link rel="manifest" href="manifest.json">
  <link rel="icon" type="image/png" sizes="32x32" href="../icons/favicon-32.png">
  <link rel="apple-touch-icon" href="../icons/apple-touch-icon.png">
  <link rel="preconnect" href="https://script.google.com">
  <link rel="preconnect" href="https://script.googleusercontent.com">
  <style>
    html, body { margin: 0; height: 100%; background: #0d0f15; overflow: hidden; }
    iframe { border: 0; width: 100%; height: 100%; display: block; background: #fff; }
    .loader {
      position: fixed; inset: 0; z-index: 2;
      display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 22px;
      background: radial-gradient(60% 50% at 30% 20%, rgba(229,57,53,.35), transparent 70%), radial-gradient(60% 50% at 80% 90%, rgba(63,81,181,.35), transparent 70%), #0d0f15;
      color: #c4c9d4; font: 600 14px Inter, Roboto, Arial, sans-serif;
      transition: opacity .35s cubic-bezier(.22,.9,.24,1), visibility 0s linear .35s;
    }
    .loader.done { opacity: 0; visibility: hidden; }
    .spin-wrap { position: relative; width: 150px; height: 150px; display: grid; place-items: center; }
    .spin-wrap img { width: 84px; height: auto; animation: breathe 1.6s ease-in-out infinite; will-change: transform; }
    .spin-ring { position: absolute; inset: 0; border-radius: 50%;
      background: conic-gradient(from 0deg, rgba(255,82,82,0) 0deg, rgba(255,82,82,0) 200deg, #ff5252 360deg);
      -webkit-mask: radial-gradient(farthest-side, transparent calc(100% - 4px), #000 calc(100% - 3px));
              mask: radial-gradient(farthest-side, transparent calc(100% - 4px), #000 calc(100% - 3px));
      animation: spin .9s linear infinite; will-change: transform; }
    @keyframes breathe { 0%,100% { transform: scale(1); } 50% { transform: scale(1.07); } }
    @keyframes spin { to { transform: rotate(360deg); } }
    .loader a { color: #fff; font-size: 13px; opacity: 0; transition: opacity .4s; }
    .loader a.show { opacity: 1; }
  </style>
</head>
<body>
  <iframe id="app" title="DSR Form" allow="camera; microphone; geolocation; clipboard-write" src="https://script.google.com/macros/s/AKfycbzCp3U0bTIoWtPwdfob7Sqc6UEQzw6_e2eVFdp47QcPePKz3wErVz1K8kDs1J433T5r/exec"></iframe>
  <div class="loader" id="loader">
    <div class="spin-wrap"><span class="spin-ring"></span><img src="../assets/saburi-mark-white.webp" alt="" width="560" height="553"></div>
    <span>Opening DSR Form…</span>
    <a id="direct" href="https://script.google.com/macros/s/AKfycbzCp3U0bTIoWtPwdfob7Sqc6UEQzw6_e2eVFdp47QcPePKz3wErVz1K8kDs1J433T5r/exec" target="_blank" rel="noopener">Taking long? Open in Chrome</a>
  </div>
  <script>
    document.getElementById('app').addEventListener('load', function () { document.getElementById('loader').classList.add('done'); });
    setTimeout(function () { document.getElementById('direct').classList.add('show'); }, 8000);
    if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js');
  </script>
</body>
</html>
